[pytest]
markers =
    integration: tests that exercise real infrastructure or vertical module flows
    postgres: tests that require PostgreSQL to be reachable
    qdrant: tests that require Qdrant to be reachable
    redis: tests that require Redis to be reachable
    ragas_eval: slow, paid LLM evaluation (Fase 2 quality baseline); opt-in via RUN_RAGAS_EVAL=1
