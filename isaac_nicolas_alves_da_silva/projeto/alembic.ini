; Arquivo de configuração do Alembic.
;
; Fica na raiz do projeto porque é a partir daqui que os comandos `alembic`
; serão executados (mesmo diretório do requirements.txt e do venv/).

[alembic]
# Pasta onde ficam o env.py, o template de migration e as migrations geradas.
# Colocamos dentro de apps/api porque é onde vive o restante do código da API
# e do banco (apps/api/src/database).
script_location = apps/api/migrations

# A DATABASE_URL real (com usuário/senha/host) NÃO fica aqui.
# Ela é carregada dinamicamente em env.py a partir do Settings (.env),
# para não duplicar configuração nem versionar credenciais no Git.
# sqlalchemy.url = (definida em env.py)

# Formato do nome dos arquivos de migration gerados em versions/.
# Inclui data/hora para ficar fácil ver a ordem cronológica.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Codificação usada para ler/escrever os arquivos de migration.
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
