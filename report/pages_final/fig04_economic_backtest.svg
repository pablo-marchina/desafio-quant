<text x="80" y="835" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#2DD4BF">Análise: ARGOS expandiu o universo, mas recusou transformar cobertura insuficiente em claim de alpha.</text>
<text x="80" y="865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#9FB0C3">Política final: reportar 1.355 como infraestrutura official-domain e usar o backtest completo de 108/109 como evidência econômica, sem PnL ampliado.</text>
