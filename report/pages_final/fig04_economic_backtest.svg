<rect x="830" y="585" width="690" height="195" rx="20" fill="#14283D" stroke="#F4BF4F" stroke-width="2"/>
<text x="865" y="630" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F4F7FB">Último backtest econômico completo permanece</text>
<text x="865" y="678" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#9FB0C3">R1 • T−1 • 10 sessões • 108 oportunidades • 34 trades</text>
<text x="865" y="720" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#FF6B6B">MA net −0,2050%</text>
