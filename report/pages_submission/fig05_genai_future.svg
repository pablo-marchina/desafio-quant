<text x="170" y="375" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">IA propõe</text>
<text x="390" y="375" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#9FB0C3" text-anchor="start">hipóteses, checks e scripts</text>
