<text x="170" y="567" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Aceita ou rejeita</text>
<text x="390" y="567" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#9FB0C3" text-anchor="start">sem resultado forçado</text>
<text x="115" y="615" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Valor agregado concreto: ideias → código/CI → auditoria outcome-blind → relatório visual.</text>
<text x="115" y="640" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#9FB0C3" text-anchor="start">Limite: GenAI não substitui protocolo, dados PIT nem decisão de promoção.</text>
