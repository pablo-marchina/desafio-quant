<text x="80" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#9FB0C3" text-anchor="start">IA ajudou a propor, codar e auditar; evidência só entrou após fontes, CI e freezes.</text>
