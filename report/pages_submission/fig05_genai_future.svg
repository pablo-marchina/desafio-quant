<text x="115" y="795" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F4F7FB" text-anchor="start">A disciplina do ARGOS não é sempre operar; é saber quando a evidência ainda não autoriza risco.</text>
<text x="115" y="840" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" fill="#9FB0C3" text-anchor="start">Próximo passo natural: aplicar a mesma arquitetura em universos com maior cobertura PIT.</text>
