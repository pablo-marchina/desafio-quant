<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#9FB0C3"/></marker><marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#F4BF4F"/></marker></defs>
<rect width="1600" height="900" fill="#07111F"/>
<text x="80" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#49C6E5" text-anchor="start">03 • RESULTADOS</text>
<text x="80" y="128" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" fill="#F4F7FB" text-anchor="start">M2 informou; movimento não adicionou valor suficiente</text>
<text x="80" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#9FB0C3" text-anchor="start">A falha de H2 não é derrota: ela bloqueia overfit antes de colocar capital em risco.</text>
<path d="M 1411.5 85 Q 1450 57.5 1488.5 85" fill="none" stroke="#49C6E5" stroke-width="2.75"/>
<path d="M 1421.4 89.4 Q 1450 111.4 1478.6 89.4" fill="none" stroke="#2DD4BF" stroke-width="2.75"/>
<path d="M 1403.8 94.9 Q 1430.75 125.7 1461.0 111.4" fill="none" stroke="#F4BF4F" stroke-width="2.2" stroke-dasharray="9,6"/>
<circle cx="1450" cy="87.75" r="6.6" fill="#F4F7FB"/><circle cx="1450" cy="87.75" r="2.75" fill="#49C6E5"/>
<text x="1450" y="136" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#F4F7FB" text-anchor="middle">ARGOS</text>
<rect x="95" y="220" width="420" height="160" rx="22" fill="#14283D" stroke="#2DD4BF" stroke-width="2"/>
<text x="123" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#2DD4BF" text-anchor="start">H1 PASS</text>
<text x="123" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">Mercado preditivo tinha sinal</text>
<text x="123" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C3" text-anchor="start">M2 superou baselines públicos/free</text>
<rect x="580" y="220" width="420" height="160" rx="22" fill="#14283D" stroke="#FF6B6B" stroke-width="2"/>
<text x="608" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#FF6B6B" text-anchor="start">H2 FAIL</text>
<text x="608" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">Movimento não melhorou M2</text>
<text x="608" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C3" text-anchor="start">sem ganho incremental robusto</text>
<rect x="1065" y="220" width="420" height="160" rx="22" fill="#14283D" stroke="#F4BF4F" stroke-width="2"/>
<text x="1093" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#F4BF4F" text-anchor="start">STOP RULE</text>
<text x="1093" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">Parar antes do capital</text>
<text x="1093" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C3" text-anchor="start">H3-H5 ficam bloqueados</text>
<rect x="95" y="420" width="685" height="245" rx="20" fill="#0E1B2B" stroke="#294158" stroke-width="2"/>
<text x="130" y="468" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#49C6E5" text-anchor="start">Teste fora da amostra</text>
<text x="130" y="507" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#F4F7FB" text-anchor="start">M2 continuou sendo o melhor resumo probabilístico.</text>
<text x="130" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#F4F7FB" text-anchor="start">Baseline M2</text>
<rect x="300" y="538" width="330" height="24" rx="12" fill="#2DD4BF"/>
<text x="655" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#2DD4BF" text-anchor="start">champion</text>
<text x="130" y="605" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#F4F7FB" text-anchor="start">Movimento / fluxo</text>
<rect x="300" y="585" width="175" height="24" rx="12" fill="#FF6B6B"/>
<text x="655" y="605" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#FF6B6B" text-anchor="start">não promove</text>
<text x="130" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9FB0C3" text-anchor="start">Métrica: Brier/log loss, OOS, clusters por data.</text>
<rect x="820" y="420" width="685" height="245" rx="20" fill="#0E1B2B" stroke="#F4BF4F" stroke-width="2"/>
<text x="855" y="468" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4BF4F" text-anchor="start">Interpretação correta</text>
<text x="855" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#F4F7FB" text-anchor="start">Falhar H2 protege capital.</text>
<text x="855" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" fill="#9FB0C3" text-anchor="start">O robô só avançaria se o sinal extra explicasse mais que M2.</text>
<text x="855" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" fill="#9FB0C3" text-anchor="start">Como não explicou, o protocolo impede cherry-picking.</text>
<text x="855" y="642" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#2DD4BF" text-anchor="start">Decisão: testar dinheiro apenas na regra econômica congelada.</text>
<rect x="95" y="705" width="1410" height="125" rx="22" fill="#241A20" stroke="#FF6B6B" stroke-width="2"/>
<text x="130" y="750" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#FF6B6B" text-anchor="start">Mensagem para leitura rápida:</text>
<text x="130" y="785" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">ARGOS não “falhou em operar”; ele recusou operar quando a evidência incremental não passou.</text>
<text x="130" y="818" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4BF4F" text-anchor="start">Essa disciplina preserva o champion econômico C0_NO_TRADE.</text>
</svg>