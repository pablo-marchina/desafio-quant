<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <style>
      /* Cores e estilos inspirados na NVIDIA e em grafos */
      .line { fill: none; stroke: #76B900; stroke-width: 1.5; opacity: 0.7; }
      .spiral { fill: none; stroke: #76B900; stroke-width: 2.5; }
      .node { fill: #76B900; stroke: #ffffff; stroke-width: 1.5; }
      .core { fill: #76B900; }
    </style>
  </defs>

  <path class="line" d="M 50,150 L 150,85 L 250,150 L 150,215 Z" />
  <path class="line" d="M 80,150 L 150,110 L 220,150 L 150,190 Z" />
  <path class="line" d="M 150,85 L 150,215" />
  <path class="line" d="M 50,150 L 250,150" />

  <path class="spiral" d="M 50,150 C 90,60 210,60 250,150 C 220,220 120,230 100,160 C 90,120 130,105 160,115 C 190,125 190,165 150,175" />

  <circle class="node" cx="50" cy="150" r="6" />
  <circle class="node" cx="250" cy="150" r="6" />
  <circle class="node" cx="150" cy="85" r="6" />
  <circle class="node" cx="150" cy="215" r="6" />
  
  <circle class="node" cx="80" cy="150" r="5" />
  <circle class="node" cx="220" cy="150" r="5" />
  <circle class="node" cx="100" cy="160" r="5" />
  <circle class="node" cx="160" cy="115" r="5" />
  <circle class="node" cx="150" cy="175" r="5" />
  <circle class="node" cx="150" cy="110" r="4" />
  <circle class="node" cx="150" cy="190" r="4" />

  <circle class="core" cx="150" cy="150" r="24" opacity="0.15" />
  <circle class="line" cx="150" cy="150" r="24" stroke-width="1.5" />
  <circle class="node" cx="126" cy="150" r="4" />
  <circle class="node" cx="174" cy="150" r="4" />
  
  <rect x="138" y="152" width="4" height="8" fill="#76B900" />
  <rect x="148" y="146" width="4" height="14" fill="#76B900" />
  <rect x="158" y="138" width="4" height="22" fill="#76B900" />
  
  <polygon points="138,144 144,144 141,136" fill="#76B900" />

</svg>
