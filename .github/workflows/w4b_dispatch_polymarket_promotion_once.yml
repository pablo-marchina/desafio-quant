name: W4-B Dispatch Polymarket Promotion Once
on:
  push:
    paths:
      - '.github/workflows/w4b_dispatch_polymarket_promotion_once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch promoter with authoritative finalizer provenance
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/${{ github.repository }}/actions/workflows/w4b_promote_polymarket_recensus.yml/dispatches' \
            -d '{"ref":"main","inputs":{"source_run_id":"31732895538","source_head_sha":"7748befffbdc3732000ccd6f3cd07b58bad78876"}}'
