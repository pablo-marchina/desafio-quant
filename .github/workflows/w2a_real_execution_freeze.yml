name: W2A Real Execution Byte Freeze
on:
  push:
    branches: [main]
    paths:
      - 'data/w2a/**'
      - 'scripts/w2a_gate0_recover_inputs_v1.py'
      - 'scripts/w2a_funded_portfolio_engine_v1.py'
      - 'scripts/test_w2a_funded_portfolio_engine_v1.py'
      - 'scripts/w2a_real_execution_freeze_validate.py'
      - 'registry/w2a_gate0_reconciliation_v2.json'
      - 'registry/w2a_real_execution_freeze_v1.json'
      - '.github/workflows/w2a_real_execution_freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned numeric runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3
      - name: Validate byte freeze
        run: python scripts/w2a_real_execution_freeze_validate.py
      - name: Re-run synthetic funded accounting test
        run: python scripts/test_w2a_funded_portfolio_engine_v1.py
      - name: Assert no funded output was materialized in freeze commit
        run: |
          test ! -e registry/w2a_results/w2a_funded_portfolio_summary.json
          test ! -e registry/w2a_results/w2a_funded_daily_ledger.csv
