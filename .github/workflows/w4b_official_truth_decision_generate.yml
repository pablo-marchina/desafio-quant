name: W4-B Official Truth Decision Generate
on:
  push:
    paths: ['registry/w4b_official_truth_decision_generation_erratum_v1_0_2.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Restore frozen occurrence evidence
        run: |
          git fetch origin w4b-official-macro-occurrences-v1
          test "$(git rev-parse origin/w4b-official-macro-occurrences-v1)" = '181bb80efe3555aa91252faf856951908f55c9e8'
          git checkout origin/w4b-official-macro-occurrences-v1 -- \
            registry/w4b_official_macro_occurrences_v1.csv.gz \
            registry/w4b_official_macro_source_manifest_v1.csv.gz \
            registry/w4b_official_macro_occurrence_summary_v1.json
      - name: Validate decision freeze, provenance errata and byte identities
        run: |
          python - <<'PY'
          import json,os,subprocess
          f=json.load(open('registry/w4b_official_truth_decision_generation_freeze_v1.json'))
          e1=json.load(open('registry/w4b_official_truth_decision_generation_erratum_v1_0_1.json'))
          e=json.load(open('registry/w4b_official_truth_decision_generation_erratum_v1_0_2.json'))
          b=lambda p:subprocess.check_output(['git','hash-object',p],text=True).strip()
          assert f['status']=='FROZEN_BEFORE_OFFICIAL_TRUTH_DECISION_GENERATION'
          assert e1['failed_run_id']==31739095110
          assert e['status']=='FROZEN_AFTER_OCCURRENCE_SUMMARY_BLOB_PROVENANCE_MISMATCH_BEFORE_ANY_DECISION_RESULT'
          assert e['failed_run_id']==31739222264 and e['scientific_contract_changes'] is False and e['science_reopened'] is False
          assert e['decision_results_observed_before_erratum'] is False
          assert e['correct_occurrence_evidence_commit']=='181bb80efe3555aa91252faf856951908f55c9e8'
          assert f['queue_rows_expected']==2275 and f['as_of_date']=='2026-08-13'
          observed={
            'macro_protocol':b('registry/w4b_official_macro_truth_automation_protocol_v1.json'),
            'generator':b('scripts/w4b_official_truth_decisions_from_occurrences_v1.py'),
            'queue':b('registry/w4b_official_event_truth_queue_v1.csv.gz'),
            'template':b('registry/w4b_official_event_truth_decisions_template_v1.csv'),
            'occurrence_csv':b('registry/w4b_official_macro_occurrences_v1.csv.gz'),
            'occurrence_summary':b('registry/w4b_official_macro_occurrence_summary_v1.json'),
            'workflow':b('.github/workflows/w4b_official_truth_decision_generate.yml')}
          print(json.dumps(observed,indent=2,sort_keys=True))
          assert observed['macro_protocol']=='49ebc0d7888149833fd1c741ac172dcbd0b0413d'
          assert observed['generator']=='c30f5f6bccea970b03b8f9f06204f305c6cb625a'
          assert observed['queue']=='5757eae1a8ee8e3cdc3554459b2a2cbd48d378ae'
          assert observed['template']=='2993cb673645bac18ad2c71b8769d1a685892dad'
          assert observed['occurrence_csv']=='6ceae579a62a54b6932a95b25cd0af34e3999f83'
          assert observed['occurrence_summary']=='a19904873da2751c0e29943f9928e08c6e0cd85b'
          assert observed['workflow']==e['workflow_blob_sha1']
          x=json.load(open('registry/w4b_official_macro_occurrence_summary_v1.json'))
          assert x['gate_decision']=='PASS_OFFICIAL_MACRO_OCCURRENCES_MATERIALIZED' and x['occurrence_rows']==688
          assert x['release_values_read_or_persisted'] is False and x['prediction_market_outcomes_read'] is False and x['linked_asset_realized_returns_read'] is False
          assert not os.path.exists('registry/w4b_official_event_truth_decisions_v1.csv')
          print('PASS_W4B_OFFICIAL_TRUTH_DECISION_ERRATUM_V1_0_2_FREEZE')
          PY
      - name: Generate deterministic fail-closed decisions
        run: python scripts/w4b_official_truth_decisions_from_occurrences_v1.py
      - name: Validate decision-generation firewall
        run: |
          python - <<'PY'
          import csv,json
          with open('registry/w4b_official_event_truth_decisions_v1.csv',encoding='utf-8',newline='') as f:r=list(csv.DictReader(f))
          x=json.load(open('registry/w4b_official_truth_decision_generation_summary_v1.json'))
          allowed={'VERIFIED_OFFICIAL_TRUTH','UNRESOLVED_OFFICIAL_TRUTH','REJECT_NOT_SAME_SEMANTIC_EVENT','NOT_HISTORICAL_YET'}
          assert len(r)==2275 and len({z['exact_group_id'] for z in r})==2275
          assert {z['verification_state'] for z in r}<=allowed and all(z['verification_state'] and z['review_mode'] for z in r)
          assert x['queue_rows']==2275 and sum(x['decision_state_counts'].values())==2275
          assert x['performance_blind'] is True and x['prediction_market_performance_read'] is False
          assert x['prediction_market_settlement_result_used'] is False and x['linked_asset_realized_returns_read'] is False
          assert x['economic_release_values_read'] is False and x['nonmacro_automatically_verified'] is False
          print(json.dumps(x,indent=2,sort_keys=True)); print('PASS_W4B_OFFICIAL_TRUTH_DECISION_GENERATION_FIREWALL')
          PY
      - name: Persist decisions evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B w4b-official-truth-decisions-v1 main
          git add registry/w4b_official_event_truth_decisions_v1.csv registry/w4b_official_truth_decision_generation_summary_v1.json
          git commit -m 'evidence: generate W4-B official-truth decisions v1.0.2'
          git push -f origin w4b-official-truth-decisions-v1
