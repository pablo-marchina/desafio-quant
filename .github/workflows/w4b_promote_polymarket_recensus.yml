name: W4-B Promote Polymarket Recensus
on:
  workflow_run:
    workflows: ['W4-B Polymarket Exhaustive Recensus']
    types: [completed]
permissions:
  contents: write
  actions: write
jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch Polymarket evidence branch
        run: |
          git fetch origin w4b-polymarket-recensus-v1
          git checkout origin/w4b-polymarket-recensus-v1 -- \
            registry/w4b_polymarket_recensus_page_manifest_v1.csv.gz \
            registry/w4b_polymarket_recensus_venue_events_v1.csv.gz \
            registry/w4b_polymarket_recensus_events_v1.csv.gz \
            registry/w4b_polymarket_recensus_ambiguous_v1.csv.gz \
            registry/w4b_polymarket_w2_overlap_v1.csv.gz \
            registry/w4b_polymarket_recensus_summary_v1.json
      - name: Validate and create Polymarket closeout
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          R=Path('registry'); x=json.load(open(R/'w4b_polymarket_recensus_summary_v1.json'))
          assert x['gate_decision']=='PASS_POLYMARKET_RECENSUS_MATERIALIZED'
          assert x['performance_blind'] is True
          assert x['linked_asset_realized_returns_read'] is False
          assert x['clob_price_history_read'] is False
          assert x['selection_by_volume_liquidity_or_price'] is False
          assert not x['pagination_unresolved'] and not x['canonical_collisions']
          files=['w4b_polymarket_recensus_page_manifest_v1.csv.gz','w4b_polymarket_recensus_venue_events_v1.csv.gz','w4b_polymarket_recensus_events_v1.csv.gz','w4b_polymarket_recensus_ambiguous_v1.csv.gz','w4b_polymarket_w2_overlap_v1.csv.gz','w4b_polymarket_recensus_summary_v1.json']
          def blob(p): return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          manifests={f:{'blob_sha1':blob(R/f),'sha256':hashlib.sha256((R/f).read_bytes()).hexdigest()} for f in files}
          close={
            'artifact':'W4B_POLYMARKET_RECENSUS_CLOSEOUT','version':'W4B-PM-CLOSE-v1.0','date':'2026-08-13',
            'technical_gate_decision':x['gate_decision'],'accepted_unique_canonical_events':x['accepted_unique_canonical_events'],
            'unique_gamma_event_ids':x['unique_gamma_event_ids'],'pages_fetched':x['pages_fetched'],
            'performance_blind':True,'linked_asset_realized_returns_read':False,'clob_price_history_read':False,
            'source_workflow_run_id':int(os.environ['SOURCE_RUN_ID']),'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
            'files':manifests
          }
          (R/'w4b_polymarket_recensus_closeout_v1.json').write_text(json.dumps(close,indent=2,sort_keys=True)+'\n')
          print(json.dumps(close,indent=2,sort_keys=True))
          PY
      - name: Promote to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            registry/w4b_polymarket_recensus_page_manifest_v1.csv.gz \
            registry/w4b_polymarket_recensus_venue_events_v1.csv.gz \
            registry/w4b_polymarket_recensus_events_v1.csv.gz \
            registry/w4b_polymarket_recensus_ambiguous_v1.csv.gz \
            registry/w4b_polymarket_w2_overlap_v1.csv.gz \
            registry/w4b_polymarket_recensus_summary_v1.json \
            registry/w4b_polymarket_recensus_closeout_v1.json
          git commit -m 'results: promote passed W4-B Polymarket recensus v1'
          # Promotion starts from current main. Keep the push fail-closed instead
          # of rebasing through legacy worktree normalization changes.
          git push origin HEAD:main
      - name: Dispatch frozen cross-venue dedup
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/${{ github.repository }}/actions/workflows/w4b_cross_venue_dedup.yml/dispatches' \
            -d '{"ref":"main"}'
