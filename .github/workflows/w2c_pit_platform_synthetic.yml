name: W2C PIT-A Synthetic Validation

on:
  push:
    branches: [main]
    paths:
      - 'registry/w2c_pit_platform_protocol_v1_0.json'
      - 'scripts/w2c_pit_platform_v1_0.py'
      - 'scripts/w2c_pit_platform_synthetic.py'
      - '.github/workflows/w2c_pit_platform_synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile frozen-candidate-free PIT-A code
        run: python -m py_compile scripts/w2c_pit_platform_v1_0.py scripts/w2c_pit_platform_synthetic.py
      - name: Run PIT-A synthetic adversarial cases
        run: python scripts/w2c_pit_platform_synthetic.py
      - name: Assert no network or real queue access
        run: |
          python - <<'PY'
          import json
          x=json.load(open('registry/w2c_pit_platform_synthetic_summary.json'))
          assert x['failed']==0
          assert x['real_semantic_queue_read'] is False
          assert x['network_accessed'] is False
          assert x['performance_data_read'] is False
          print(x['status'])
          PY
