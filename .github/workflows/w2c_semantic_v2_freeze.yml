name: W2C Semantic v2 Byte Freeze
on:
  push:
    branches: [main]
    paths:
      - 'registry/w2c_semantic_validation_protocol_v2_0.json'
      - 'registry/w2c_semantic_v2_precision_amendment.json'
      - 'scripts/w2c_semantic_validation_v2_0.py'
      - 'scripts/w2c_semantic_validation_v2_strict.py'
      - 'scripts/w2c_semantic_validation_v2_synthetic_strict.py'
      - 'registry/w2c_semantic_v2_freeze_manifest.json'
      - 'scripts/w2c_semantic_v2_freeze_validate.py'
      - '.github/workflows/w2c_semantic_v2_freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact v2 bytes and original input
        run: python scripts/w2c_semantic_v2_freeze_validate.py
      - name: Re-run all 56 pre-real adversarial attacks
        run: python scripts/w2c_semantic_validation_v2_synthetic_strict.py
      - name: Assert v2 freeze firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('registry/w2c_semantic_v2_synthetic_summary.json'))
          assert x['status']=='PASS_56_OF_56'
          assert x['real_candidate_data_read'] is False
          assert x['performance_data_read'] is False
          assert x['f1_f9_read'] is False and x['ias_read'] is False
          PY
