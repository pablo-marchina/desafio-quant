name: W4-B Official Truth Queue Profile Once
on:
  push:
    paths:
      - '.github/workflows/w4b_official_truth_queue_profile_once.yml'
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Profile frozen truth queue without decisions
        run: |
          python - <<'PY'
          import csv,gzip,collections
          p='registry/w4b_official_event_truth_queue_v1.csv.gz'
          with gzip.open(p,'rt',encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          by=collections.defaultdict(list)
          for r in rows:
              by[(r['resolved_family'],r['normalized_subject_key'])].append(r['event_reference_date'])
          print('QUEUE_ROWS',len(rows))
          for (fam,sub),dates in sorted(by.items()):
              print(f'{fam}\t{sub}\t{len(dates)}\t{min(dates)}\t{max(dates)}')
          PY
