name: ART-028 Movement Data Feasibility

on:
  push:
    paths:
      - 'scripts/art028_movement_data_feasibility.py'
      - 'data/ic03_audit_ready_tape.csv.gz'
      - 'data/ic04_yes_probability_trajectory.csv.gz'
      - 'registry/ic02_event_manifest.csv'
      - 'registry/pass_b_summary.json'
      - '.github/workflows/art028_movement_data_feasibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  art028:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ART-028 materialization
        run: python scripts/art028_movement_data_feasibility.py
      - name: Validate outcome-blind gate
        run: |
          python - <<'PY'
          import csv, gzip, json
          s=json.load(open('registry/art028_summary.json',encoding='utf-8'))
          assert s['outcomes_or_performance_read_by_script'] is False
          assert s['events_total']==117
          assert s['structurally_available_events']==115
          assert s['core_feature_families_required']==7
          assert s['core_feature_families_passing_coverage']==7
          assert s['decision']=='PASS_ART028_MOVEMENT_DATA_FEASIBILITY_ALL_CORE_FAMILIES_MATERIALIZED'
          with gzip.open('data/art028_h2_feature_matrix.csv.gz','rt',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==117
          assert sum(r['structurally_available']=='true' for r in rows)==115
          PY
      - name: Commit ART-028 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/art028_h2_feature_matrix.csv.gz registry/art028_feature_dictionary.csv registry/art028_feature_coverage.csv registry/art028_feature_distribution.csv registry/art028_era_stability.csv registry/art028_feature_correlations.csv registry/art028_summary.json docs/24_art028_movement_data_feasibility.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'art028: freeze movement feature feasibility'
          git push
