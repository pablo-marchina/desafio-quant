name: IC-06 Event Timing Data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ic06_materialize_event_timing.py'
      - '.github/workflows/ic06_event_timing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Materialize timing contract
        run: |
          python scripts/ic06_materialize_event_timing.py \
            --input registry/ic02_event_manifest.csv \
            --out-dir ic06_output
      - name: Publish
        run: |
          cp ic06_output/ic06_event_timing.csv registry/ic06_event_timing.csv
          cp ic06_output/ic06_summary.json registry/ic06_summary.json
          cp ic06_output/ic06_report.md docs/19_ic06_event_timing_report.md
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/ic06_event_timing.csv registry/ic06_summary.json docs/19_ic06_event_timing_report.md
          git commit -m 'data: record IC-06 event timing data contract'
          git push
