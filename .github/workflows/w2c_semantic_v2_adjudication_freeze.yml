name: W2C Adjudication Byte Freeze
on:
  push:
    branches: [main]
    paths:
      - 'registry/w2c_semantic_v2_adjudication_protocol_v1_0.json'
      - 'scripts/w2c_semantic_v2_adjudication_export.py'
      - 'scripts/w2c_semantic_v2_adjudication_materialize.py'
      - 'scripts/w2c_semantic_v2_adjudication_synthetic.py'
      - 'registry/w2c_semantic_v2_adjudication_freeze_manifest.json'
      - 'scripts/w2c_semantic_v2_adjudication_freeze_validate.py'
      - '.github/workflows/w2c_semantic_v2_adjudication_freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate adjudication frozen bytes and 329-row input
        run: python scripts/w2c_semantic_v2_adjudication_freeze_validate.py
      - name: Re-run adjudication synthetic firewall
        run: python scripts/w2c_semantic_v2_adjudication_synthetic.py
      - name: Assert no real queue reveal in freeze gate
        run: |
          python - <<'PY'
          import json
          x=json.load(open('registry/w2c_semantic_v2_adjudication_synthetic_summary.json'))
          assert x['status']=='PASS_16_OF_16'
          assert x['real_queue_read'] is False and x['performance_data_read'] is False and x['network_accessed'] is False
          PY
