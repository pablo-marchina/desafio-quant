name: Closeout Official EPS Reconstruction

on:
  push:
    paths:
      - 'scripts/closeout_official_eps_reconstruction.py'
      - 'registry/official_eps_pending_66_seed.csv'
      - '.github/workflows/closeout_official_eps_reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Reconstruct pending official EPS outcomes
        run: python scripts/closeout_official_eps_reconstruction.py
      - name: Validate fail-closed contract
        run: |
          python - <<'PY'
          import csv,json,hashlib
          s=json.load(open('registry/official_eps_closeout_summary.json',encoding='utf-8'))
          rows=list(csv.DictReader(open('registry/official_eps_closeout_66.csv',encoding='utf-8')))
          assert len(rows)==66
          assert s['seed_events']==66
          assert s['selection_used_polymarket_outcome'] is False
          assert s['auto_validated_new']+s['remaining_pending']==66
          assert s['historical_validated']==51
          assert s['population_validated_total']==51+s['auto_validated_new']
          assert s['decision'] in {'PASS_POPULATION_COMPLETE','PARTIAL_FAIL_CLOSED_RESIDUAL_MANUAL_REVIEW'}
          for r in rows:
              if r['official_eps_status']=='AUTO_VALIDATED_OFFICIAL_SOURCE':
                  assert r['official_eps_actual']!='' and r['official_document_url'].startswith('https://www.sec.gov/')
          PY
      - name: Upload raw official evidence
        uses: actions/upload-artifact@v4
        with:
          name: closeout-official-eps-raw
          path: artifacts/closeout_eps/raw
          retention-days: 30
      - name: Commit reconstruction outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add registry/official_eps_closeout_66.csv registry/official_eps_closeout_raw_manifest.csv registry/official_eps_closeout_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'closeout: reconstruct remaining official EPS evidence'
          git push
