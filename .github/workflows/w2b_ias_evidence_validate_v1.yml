name: W2B IAS Evidence Validate v1
on:
  push:
    paths:
      - 'registry/w2b_ias_evidence_matrix_v1.csv'
      - 'registry/w2b_ias_source_registry_v1.json'
      - 'scripts/w2b_ias_evidence_validate_v1.py'
      - 'scripts/w2b_ias_frozen_bundle_integrity_v1.py'
      - '.github/workflows/w2b_ias_evidence_validate_v1.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen IAS bundle remains byte-identical
        run: python scripts/w2b_ias_frozen_bundle_integrity_v1.py
      - name: Re-run frozen synthetic suites
        run: |
          python scripts/w2b_ias_contract_synthetic_validation.py
          python scripts/w2b_ias_score_synthetic_v1.py
      - name: Validate evidence matrix and source registry
        run: python scripts/w2b_ias_evidence_validate_v1.py
      - name: Assert real scoring still not authorized
        run: |
          test ! -e registry/w2b_ias_execution_authorization_v1.json
          test ! -e registry/w2b_ias_smaa_results_v1.json
      - name: Preserve frozen submission hygiene
        run: python scripts/repository_hygiene_validate.py
