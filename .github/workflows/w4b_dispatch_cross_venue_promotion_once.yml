name: W4-B Dispatch Cross-Venue Promotion Once
on:
  push:
    paths:
      - '.github/workflows/w4b_dispatch_cross_venue_promotion_once.yml'
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch hardened cross-venue promotion
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/${{ github.repository }}/actions/workflows/w4b_promote_cross_venue_dedup.yml/dispatches' \
            -d '{"ref":"main"}'
