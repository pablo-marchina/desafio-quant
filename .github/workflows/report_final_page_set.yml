name: ARGOS Final Page Set

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/report_page_compositor_final.py'
      - 'registry/argos_visual_identity_freeze.json'
      - 'report/pages_v2/**'
      - '.github/workflows/report_final_page_set.yml'

permissions:
  contents: write

jobs:
  final-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render final page set
        run: python scripts/report_page_compositor_final.py

      - name: Validate final page boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('report/pages_final')
          manifest = json.loads((out / 'manifest.json').read_text())
          assert manifest['status'] == 'PASS_FINAL_PAGE_SET_READY_FOR_PDF_QA'
          assert manifest['scientific_reopen'] is False
          names = [
              'fig01_strategy_pipeline.svg',
              'fig02_model_reduction.svg',
              'fig03_h2_results.svg',
              'fig04_economic_backtest.svg',
              'fig05_genai_future.svg',
          ]
          assert set(manifest['outputs']) == set(names)
          forbidden = ['github.com/pablo-marchina', 'Pablo Marchina', 'Inteli']
          for name in names:
              body = (out / name).read_text(encoding='utf-8')
              assert 'viewBox="0 0 1600 900"' in body
              assert all(token not in body for token in forbidden)
          p1 = (out / names[0]).read_text(encoding='utf-8')
          assert 'Muitos olhos.' in p1 and 'Risco só com evidência incremental.' in p1
          p2 = (out / names[1]).read_text(encoding='utf-8')
          assert 'x="1430"' in p2 and 'Challenger' in p2
          print('PASS_ARGOS_FINAL_PAGE_SET_BOUNDARY')
          PY

      - name: Upload final page set
        uses: actions/upload-artifact@v4
        with:
          name: argos-final-pages-${{ github.run_id }}
          path: report/pages_final/
          if-no-files-found: error
          retention-days: 30

      - name: Commit final page set
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report/pages_final/
          if git diff --cached --quiet; then
            echo 'No final-page changes.'
          else
            git commit -m 'report: materialize final five-page SVG set'
            git push origin HEAD:main
          fi
