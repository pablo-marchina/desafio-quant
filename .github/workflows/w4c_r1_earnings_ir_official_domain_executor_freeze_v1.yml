name: W4-C R1 earnings IR official-domain executor freeze v1

on:
  push:
    paths:
      - 'registry/w4c_r1_earnings_ir_official_domain_discovery_protocol_v1.json'
      - 'scripts/w4c_r1_earnings_ir_official_domain_discovery_executor_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate executor without network
        run: python3 scripts/w4c_r1_earnings_ir_official_domain_discovery_executor_v1.py --validate-only

      - name: Materialize byte freeze manifest
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          paths = [
              'registry/w4c_r1_earnings_ir_official_domain_discovery_protocol_v1.json',
              'scripts/w4c_r1_earnings_ir_official_domain_discovery_executor_v1.py',
              'registry/w4c_r1_earnings_ir_probe_sample_v1.json',
              'registry/w4c_r1_earnings_ticker_profile_v1.json',
          ]
          def blob_sha(path):
              data = Path(path).read_bytes()
              return hashlib.sha1(f'blob {len(data)}\\0'.encode() + data).hexdigest()
          manifest = {
              'artifact': 'W4C_R1_EARNINGS_IR_OFFICIAL_DOMAIN_DISCOVERY_EXECUTOR_FREEZE',
              'version': 'W4C-R1-EIR-ODD-EXEC-v1.0',
              'status': 'FROZEN_EXECUTOR_PRE_EXTERNAL_REQUEST',
              'gate_decision': 'PASS_W4C_R1_EARNINGS_IR_OFFICIAL_DOMAIN_EXECUTOR_FROZEN_PRE_REQUEST',
              'external_requests_performed_before_freeze': False,
              'issuer_ir_lookup_performed_before_freeze': False,
              'sample_size': 40,
              'bound_files': [{'path': p, 'git_blob_sha': blob_sha(p)} for p in paths],
              'execution_authorization': {
                  'env': 'W4C_R1_EARNINGS_IR_OFFICIAL_DOMAIN_EXECUTE',
                  'token': 'YES_FROZEN_OFFICIAL_DOMAIN_PROBE',
                  'manual_or_dispatch_only': True
              },
              'scientific_firewall': {
                  'earnings_numeric_outcomes_allowed': False,
                  'prediction_market_settlement_allowed': False,
                  'realized_returns_allowed': False,
                  'argos_pnl_allowed': False,
                  'n_final_backtestable_authorized': False
              }
          }
          Path('registry/w4c_r1_earnings_ir_official_domain_discovery_executor_freeze_v1.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\\n', encoding='utf-8')
          PY

      - name: Commit freeze manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/w4c_r1_earnings_ir_official_domain_discovery_executor_freeze_v1.json
          git diff --cached --quiet || git commit -m 'registry: freeze official-domain earnings IR executor'
          git push
