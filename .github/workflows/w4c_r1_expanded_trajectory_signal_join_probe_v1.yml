name: W4-C R1 expanded trajectory signal join probe v1

on:
  push:
    paths:
      - 'registry/w4c_r1_expanded_trajectory_signal_join_probe_execute_authorization_v1.json'

permissions:
  contents: write

jobs:
  probe-trajectory-join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe trajectory PIT signal join without outcome reads
        run: python3 scripts/w4c_r1_expanded_trajectory_signal_join_probe_v1.py

      - name: Commit trajectory join probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/w4c_r1_expanded_trajectory_signal_join_probe_v1.json
          git commit -m 'registry: materialize W4-C R1 trajectory signal join probe v1'
          git push origin HEAD:main
