name: W2C Adjudication v1.1 Byte Freeze
on:
  push:
    branches: [main]
    paths:
      - 'registry/w2c_semantic_v2_adjudication_protocol_v1_1.json'
      - 'scripts/w2c_semantic_v2_adjudication_export_v1_1.py'
      - 'scripts/w2c_semantic_v2_adjudication_materialize_v1_1.py'
      - 'scripts/w2c_semantic_v2_adjudication_synthetic_v1_1.py'
      - 'registry/w2c_semantic_v2_adjudication_v1_1_freeze_manifest.json'
      - 'scripts/w2c_semantic_v2_adjudication_v1_1_freeze_validate.py'
      - '.github/workflows/w2c_semantic_v2_adjudication_v1_1_freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact v1.1 bytes and 335-row input
        run: python scripts/w2c_semantic_v2_adjudication_v1_1_freeze_validate.py
      - name: Re-run all 19 synthetic checks
        run: python scripts/w2c_semantic_v2_adjudication_synthetic_v1_1.py
      - name: Assert no title reveal before freeze
        run: |
          python - <<'PY'
          import json
          x=json.load(open('registry/w2c_semantic_v2_adjudication_v1_1_synthetic_summary.json'))
          assert x['status']=='PASS_19_OF_19'
          assert x['real_queue_read'] is False and x['titles_read'] is False
          assert x['performance_data_read'] is False and x['network_accessed'] is False
          PY
