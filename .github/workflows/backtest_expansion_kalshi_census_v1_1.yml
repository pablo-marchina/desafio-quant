name: Backtest Expansion Kalshi Census v1.1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_expansion_kalshi_census_v1_1.py'
      - '.github/workflows/backtest_expansion_kalshi_census_v1_1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify unchanged scientific base
        run: |
          test "$(git hash-object scripts/backtest_expansion_kalshi_census_v1.py)" = "95c1ecf4cc8fd40c1de505165c7b6a7f9e4d8406"
      - name: Compile census implementation
        run: python -m py_compile scripts/backtest_expansion_kalshi_census_v1.py scripts/backtest_expansion_kalshi_census_v1_1.py
      - name: Enforce performance firewall
        shell: bash
        run: |
          ! grep -Eri 'registry/w2a_funded_portfolio|w2a_funded_portfolio_daily|candidate_executed_trades|matched_spy_total_return|active_terminal_wealth' scripts/backtest_expansion_kalshi_census_v1.py scripts/backtest_expansion_kalshi_census_v1_1.py
      - name: Run concurrent performance-blind Kalshi census
        env:
          ARGOS_EXPANSION_OUTDIR: artifacts/backtest_expansion_kalshi_v1_1
          ARGOS_KALSHI_WORKERS: '8'
        run: python scripts/backtest_expansion_kalshi_census_v1_1.py
      - name: Validate output firewall and lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/backtest_expansion_kalshi_v1_1/kalshi_census_summary.json').read_text())
          assert d['version']=='KALSHI-CENSUS-v1.1'
          assert d['base_scientific_script_git_blob']=='95c1ecf4cc8fd40c1de505165c7b6a7f9e4d8406'
          assert d['operational_amendment_only'] is True
          assert d['performance_blind'] is True
          assert d['linked_asset_returns_read'] is False
          assert d['pnl_read'] is False
          assert d['series_total'] > 0
          assert d['candidate_series_total'] > 0
          print('PASS_KALSHI_EXPANSION_CENSUS_V1_1_FIREWALL')
          PY
      - name: Upload census evidence
        uses: actions/upload-artifact@v4
        with:
          name: backtest-expansion-kalshi-census-v1-1
          path: artifacts/backtest_expansion_kalshi_v1_1
          if-no-files-found: error
