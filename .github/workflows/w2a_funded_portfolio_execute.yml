name: W2A Funded Portfolio Execute v1
on:
  push:
    branches: [main]
    paths:
      - 'registry/w2a_real_execution_authorization_v1.json'
      - '.github/workflows/w2a_funded_portfolio_execute.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned numeric runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3
      - name: Revalidate frozen engine and inputs
        run: python scripts/w2a_real_execution_freeze_validate.py
      - name: Validate explicit authorization against frozen bundle
        run: |
          python - <<'PY'
          import json
          a=json.load(open('registry/w2a_real_execution_authorization_v1.json'))
          f=json.load(open('registry/w2a_real_execution_freeze_v1.json'))
          v=json.load(open('registry/w2a_real_execution_freeze_validation_v1.json'))
          assert a['artifact']=='W2A_REAL_EXECUTION_AUTHORIZATION'
          assert a['version']=='W2A-REA-v1.0'
          assert a['freeze_status']=='PASS_W2A_REAL_EXECUTION_BYTE_FREEZE'
          assert a['freeze_bundle_id']==f['freeze_bundle_id']
          assert a['freeze_commit_sha']==v['freeze_commit_sha']
          assert v['freeze_bundle_id']==f['freeze_bundle_id']
          assert v['status']=='PASS_W2A_REAL_EXECUTION_BYTE_FREEZE'
          assert a['science_reopened'] is False
          assert a['performance_outputs_read_before_authorization'] is False
          assert a['execute_funded_portfolio'] is True
          print(json.dumps(a,indent=2))
          PY
      - name: Execute frozen funded backtest
        run: |
          rm -rf .w2a_out .w2a_input && mkdir .w2a_out .w2a_input
          tar -xzf data/w2a/w2a_real_inputs_v1.tar.gz -C .w2a_input
          cp data/w2a/w2a_recovered_input_manifest.json .w2a_input/
          python scripts/w2a_funded_portfolio_engine_v1.py --input-dir .w2a_input --output-dir .w2a_out
      - name: Persist exact outputs to evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B w2a-funded-v1-results
          mkdir -p registry/w2a_results
          cp .w2a_out/* registry/w2a_results/
          git add registry/w2a_results/
          git commit -m 'w2a: persist funded portfolio v1 results'
          git push --force origin HEAD:refs/heads/w2a-funded-v1-results
