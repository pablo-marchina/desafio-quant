name: W4-B Kalshi Full Population History v1.0.3
on:
  push:
    paths:
      - 'registry/w4b_kalshi_full_population_history_freeze_v1_0_3.json'
      - 'registry/w4b_kalshi_history_persistence_repair_v1_0_3_p1.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen repair identities and compile patched source without network
        run: |
          python - <<'PY'
          import json,subprocess,os
          p=json.load(open('registry/w4b_kalshi_full_population_history_protocol_v1.json'))
          e=json.load(open('registry/w4b_kalshi_history_input_identity_erratum_v1_0_1.json'))
          a2=json.load(open('registry/w4b_kalshi_history_transport_recovery_amendment_v1_0_2.json'))
          a3=json.load(open('registry/w4b_kalshi_history_url_encoding_amendment_v1_0_3.json'))
          f=json.load(open('registry/w4b_kalshi_full_population_history_freeze_v1_0_3.json'))
          s=json.load(open('registry/w4b_kalshi_semantic_summary_v1_1.json'))
          def blob(path): return subprocess.check_output(['git','hash-object',path],text=True).strip()
          assert p['version']=='W4B-KH-v1.0'
          assert e['authoritative_semantic_summary_count']==391
          assert a2['scientific_contract_changes'] is False
          assert a3['scientific_contract_changes'] is False
          assert a3['amendment_scope']=='HTTP_PATH_ENCODING_AND_FAILURE_PERSISTENCE_ONLY'
          assert s['accepted_unique_canonical_events']==391
          assert f['status']=='FROZEN_BEFORE_AUTHORITATIVE_HISTORY_V1_0_3_EXECUTION'
          assert blob('registry/w4b_kalshi_full_population_history_protocol_v1.json')=='5cf4e3c9f81b9c88e7d9219864d45f826c9914f5'
          assert blob('scripts/w4b_kalshi_full_population_history_v1.py')=='36fe13e884d0cb600be03edac6c0d730ab3d0009'
          assert blob('registry/w4b_kalshi_semantic_events_v1_1.csv.gz')=='45c26c02c53a5f5d43c56775aae29ec8858b4f64'
          assert blob('registry/w4b_kalshi_semantic_summary_v1_1.json')=='17f05eb601a7184e1a14f5230c73cf56cf730da0'
          assert blob('registry/w4b_kalshi_history_url_encoding_amendment_v1_0_3.json')=='e21dea88d0a1962fb3986a7a1eaeec280c580479'
          assert blob('scripts/w4b_kalshi_full_population_history_v1_0_3.py')=='b2861fcf1e2e337bf7c98b9a4828bc1866737e90'
          if os.path.exists('registry/w4b_kalshi_history_persistence_repair_v1_0_3_p1.json'):
              pr=json.load(open('registry/w4b_kalshi_history_persistence_repair_v1_0_3_p1.json'))
              assert pr['scientific_contract_changes'] is False
              assert pr['rerun_executor_blob_sha1']=='b2861fcf1e2e337bf7c98b9a4828bc1866737e90'
              assert pr['prior_scientific_gate_decision']=='PASS_FULL_POPULATION_HISTORY_MATERIALIZED'
              assert pr['prior_api_unresolved_count']==0
          print('PASS_W4B_HISTORY_V1_0_3_FREEZE_IDENTITIES')
          PY
          W4B_VALIDATE_ONLY=1 python scripts/w4b_kalshi_full_population_history_v1_0_3.py
      - name: Execute authoritative URL-safe all-market history audit
        id: execute
        continue-on-error: true
        run: python scripts/w4b_kalshi_full_population_history_v1_0_3.py
      - name: Validate result firewall and show full-population coverage
        if: always()
        run: |
          python - <<'PY'
          import csv,gzip,json
          x=json.load(open('registry/w4b_kalshi_history_summary_v1_0_3.json'))
          print(json.dumps({
            'canonical_events_audited':x['canonical_events_audited'],
            'unique_market_tickers_audited':x['unique_market_tickers_audited'],
            'api_unresolved_count':x['api_unresolved_count'],
            'api_unresolved_examples':x.get('api_unresolved_examples',[]),
            'history_class_counts':x['history_class_counts'],
            'distributional_core_events':x['distributional_core_events'],
            'family_history_class_counts':x['family_history_class_counts'],
            'horizon_event_counts':x['horizon_event_counts'],
            'technical_gate_decision':x['technical_gate_decision']
          },indent=2,sort_keys=True))
          assert x['version']=='W4B-KH-RESULT-v1.0.3'
          assert x['performance_blind'] is True
          assert x['linked_asset_realized_returns_read'] is False
          assert x['kalshi_settlement_results_persisted'] is False
          assert x['canonical_events_expected']==391
          assert x['canonical_events_audited']==391
          assert x['unique_market_tickers_audited']==5196
          with gzip.open('registry/w4b_kalshi_history_market_v1_0_3.csv.gz','rt') as f:
              hdr=set(next(csv.reader(f)))
          forbidden={'yes_price','no_price','price','close','open','settlement_result','result','linked_asset_return','ARGOS_PnL'}
          assert not (forbidden & hdr)
          print('PASS_W4B_HISTORY_V1_0_3_RESULT_FIREWALL')
          PY
      - name: Persist result or diagnostic evidence branch from current main
        if: always()
        run: |
          test -f registry/w4b_kalshi_history_summary_v1_0_3.json
          mkdir -p /tmp/w4b-history-v1-0-3
          cp registry/w4b_kalshi_history_market_v1_0_3.csv.gz /tmp/w4b-history-v1-0-3/
          cp registry/w4b_kalshi_history_event_v1_0_3.csv.gz /tmp/w4b-history-v1-0-3/
          cp registry/w4b_kalshi_history_summary_v1_0_3.json /tmp/w4b-history-v1-0-3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          git checkout -B w4b-kalshi-history-v1-0-3 origin/main
          cp /tmp/w4b-history-v1-0-3/w4b_kalshi_history_market_v1_0_3.csv.gz registry/
          cp /tmp/w4b-history-v1-0-3/w4b_kalshi_history_event_v1_0_3.csv.gz registry/
          cp /tmp/w4b-history-v1-0-3/w4b_kalshi_history_summary_v1_0_3.json registry/
          git add \
            registry/w4b_kalshi_history_market_v1_0_3.csv.gz \
            registry/w4b_kalshi_history_event_v1_0_3.csv.gz \
            registry/w4b_kalshi_history_summary_v1_0_3.json
          git commit -m 'results: materialize W4-B Kalshi history v1.0.3'
          git push -f origin w4b-kalshi-history-v1-0-3
      - name: Enforce zero-unresolved materialization gate
        if: always()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('registry/w4b_kalshi_history_summary_v1_0_3.json'))
          assert x['api_unresolved_count']==0
          assert x['technical_gate_decision']=='PASS_FULL_POPULATION_HISTORY_MATERIALIZED'
          print('PASS_W4B_FULL_POPULATION_HISTORY_V1_0_3')
          PY
