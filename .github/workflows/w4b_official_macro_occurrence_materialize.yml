name: W4-B Official Macro Occurrence Materialize
on:
  push:
    paths: ['registry/w4b_official_macro_occurrence_materialization_erratum_v1_0_3.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate freeze and parser errata
        run: |
          python - <<'PY'
          import json,os,subprocess
          f=json.load(open('registry/w4b_official_macro_occurrence_materialization_freeze_v1.json'))
          e1=json.load(open('registry/w4b_official_macro_occurrence_materialization_erratum_v1_0_1.json'))
          e2=json.load(open('registry/w4b_official_macro_occurrence_materialization_erratum_v1_0_2.json'))
          e=json.load(open('registry/w4b_official_macro_occurrence_materialization_erratum_v1_0_3.json'))
          b=lambda p:subprocess.check_output(['git','hash-object',p],text=True).strip()
          assert f['status']=='FROZEN_BEFORE_OFFICIAL_MACRO_OCCURRENCE_MATERIALIZATION'
          assert e1['failed_run_id']==31738056059 and e2['failed_run_id']==31738214010
          assert e['status']=='FROZEN_AFTER_BEA_HISTORICAL_PARSER_COVERAGE_FAIL_BEFORE_ANY_OCCURRENCE_RESULT_OR_DECISIONS'
          assert e['failed_run_id']==31738337931 and e['failed_stage']=='BEA_HISTORICAL_TABLE_EXTRACTION'
          assert e['scientific_contract_changes'] is False and e['science_reopened'] is False
          assert e['official_truth_decisions_observed_before_erratum'] is False and e['release_values_read_or_persisted'] is False
          assert b('registry/w4b_official_macro_truth_automation_protocol_v1.json')=='49ebc0d7888149833fd1c741ac172dcbd0b0413d'
          for p,sha in e['executor_blobs'].items(): assert b(p)==sha,(p,b(p),sha)
          assert b('.github/workflows/w4b_official_macro_occurrence_materialize.yml')==e['workflow_blob_sha1']
          assert not os.path.exists('registry/w4b_official_event_truth_decisions_v1.csv')
          print('PASS_W4B_OFFICIAL_MACRO_OCCURRENCE_ERRATUM_V1_0_3_FREEZE')
          PY
      - run: python scripts/w4b_official_macro_occurrences_bls_v1.py
      - run: python scripts/w4b_official_macro_occurrences_fed_bea_v1.py
      - run: python scripts/w4b_official_macro_occurrences_census_dol_v1.py
      - run: python scripts/w4b_official_macro_occurrences_merge_v1.py
      - name: Validate occurrence firewall
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open('registry/w4b_official_macro_occurrence_summary_v1.json'))
          assert x['gate_decision']=='PASS_OFFICIAL_MACRO_OCCURRENCES_MATERIALIZED'
          assert x['release_values_read_or_persisted'] is False and x['prediction_market_outcomes_read'] is False and x['linked_asset_realized_returns_read'] is False and x['performance_blind'] is True
          assert not os.path.exists('registry/w4b_official_event_truth_decisions_v1.csv')
          print(json.dumps(x,indent=2,sort_keys=True)); print('PASS_W4B_OFFICIAL_MACRO_OCCURRENCE_FIREWALL')
          PY
      - name: Persist evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B w4b-official-macro-occurrences-v1
          git add registry/w4b_official_macro_*.csv.gz registry/w4b_official_macro_*summary_v1.json
          git commit -m 'evidence: materialize W4-B official macro occurrences v1.0.3'
          git push -f origin w4b-official-macro-occurrences-v1
