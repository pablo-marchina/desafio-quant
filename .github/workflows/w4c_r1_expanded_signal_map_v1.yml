name: W4-C R1 expanded PIT signal map v1

on:
  push:
    paths:
      - 'registry/w4c_r1_expanded_signal_map_execute_authorization_v1.json'

permissions:
  contents: write

jobs:
  build-signal-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build expanded PIT signal map without outcome reads
        run: python3 scripts/w4c_r1_expanded_signal_map_builder_v1.py

      - name: Commit signal map outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            registry/w4c_r1_expanded_economic_backtest_signal_map_v1.csv \
            registry/w4c_r1_expanded_economic_backtest_signal_map_summary_v1.json
          git commit -m 'registry: materialize W4-C R1 expanded PIT signal map v1'
          git push origin HEAD:main
