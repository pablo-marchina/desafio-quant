name: W4-B Dispatch Chunked Polymarket Repair Once
on:
  push:
    paths:
      - '.github/workflows/w4b_dispatch_polymarket_chunked_repair_once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch chunk collector on main
        run: |
          # transport retry after checkpoint page 7500; science remains frozen
          curl --fail-with-body -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/${{ github.repository }}/actions/workflows/w4b_polymarket_recensus_chunk_collector_v1_0_1.yml/dispatches' \
            -d '{"ref":"main"}'
