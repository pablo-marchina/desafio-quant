name: W4-C R1 earnings IR transport diagnosis v1

on:
  push:
    paths:
      - 'scripts/w4c_r1_earnings_ir_probe_transport_diagnosis_v1.py'
      - 'registry/w4c_r1_earnings_ir_probe_navigation_manifest_v1.csv.gz'
      - '.github/workflows/w4c_r1_earnings_ir_probe_transport_diagnosis_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen result on main
        uses: actions/checkout@v4

      - name: Run outcome-blind transport diagnosis (no external requests)
        run: python3 scripts/w4c_r1_earnings_ir_probe_transport_diagnosis_v1.py

      - name: Commit diagnosis artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/w4c_r1_earnings_ir_probe_transport_diagnosis_v1.json
          git diff --cached --quiet || git commit -m 'registry: materialize W4-C R1 transport diagnosis'
          git push
