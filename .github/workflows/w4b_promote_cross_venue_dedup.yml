name: W4-B Promote Cross-Venue Dedup
on:
  workflow_run:
    workflows: ['W4-B Cross-Venue Pre-Truth Dedup']
    types: [completed]
permissions:
  contents: write
jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch dedup evidence branch
        run: |
          git fetch origin w4b-cross-venue-dedup-v1
          git checkout origin/w4b-cross-venue-dedup-v1 -- \
            registry/w4b_cross_venue_records_v1.csv.gz \
            registry/w4b_cross_venue_exact_groups_v1.csv.gz \
            registry/w4b_cross_venue_candidate_edges_v1.csv.gz \
            registry/w4b_cross_venue_candidate_components_v1.csv.gz \
            registry/w4b_cross_venue_dedup_summary_v1.json
      - name: Validate and create cross-venue closeout
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          R=Path('registry'); x=json.load(open(R/'w4b_cross_venue_dedup_summary_v1.json'))
          assert x['gate_decision']=='PASS_CROSS_VENUE_PRETRUTH_DEDUP_MATERIALIZED'
          assert x['performance_blind'] is True
          assert x['linked_asset_realized_returns_read'] is False
          assert x['official_event_truth_read'] is False
          assert x['venue_price_volume_liquidity_read'] is False
          assert x['final_unique_n_authorized'] is False
          assert not x['w4ce1_signature_collisions'] and not x['invalid_input_signature_records']
          files=['w4b_cross_venue_records_v1.csv.gz','w4b_cross_venue_exact_groups_v1.csv.gz','w4b_cross_venue_candidate_edges_v1.csv.gz','w4b_cross_venue_candidate_components_v1.csv.gz','w4b_cross_venue_dedup_summary_v1.json']
          def blob(p): return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          manifests={f:{'blob_sha1':blob(R/f),'sha256':hashlib.sha256((R/f).read_bytes()).hexdigest()} for f in files}
          close={
            'artifact':'W4B_CROSS_VENUE_DEDUP_CLOSEOUT','version':'W4B-XVD-CLOSE-v1.0','date':'2026-08-13',
            'technical_gate_decision':x['gate_decision'],'pre_dedup_venue_record_sum':x['pre_dedup_venue_record_sum'],
            'exact_dedup_n':x['exact_dedup_n'],'candidate_duplicate_edges':x['candidate_duplicate_edges'],
            'candidate_merge_lower_bound_n':x['candidate_merge_lower_bound_n'],'pretruth_upper_bound_n':x['pretruth_upper_bound_n'],
            'performance_blind':True,'linked_asset_realized_returns_read':False,'final_unique_n_authorized':False,
            'source_workflow_run_id':int(os.environ['SOURCE_RUN_ID']),'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
            'files':manifests
          }
          (R/'w4b_cross_venue_dedup_closeout_v1.json').write_text(json.dumps(close,indent=2,sort_keys=True)+'\n')
          print(json.dumps(close,indent=2,sort_keys=True))
          PY
      - name: Promote to main and trigger official-truth queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            registry/w4b_cross_venue_records_v1.csv.gz \
            registry/w4b_cross_venue_exact_groups_v1.csv.gz \
            registry/w4b_cross_venue_candidate_edges_v1.csv.gz \
            registry/w4b_cross_venue_candidate_components_v1.csv.gz \
            registry/w4b_cross_venue_dedup_summary_v1.json \
            registry/w4b_cross_venue_dedup_closeout_v1.json
          git commit -m 'results: promote passed W4-B cross-venue pre-truth dedup v1'
          # Promotion starts from current main; use the push itself as the
          # fail-closed fast-forward concurrency guard.
          git push origin HEAD:main
