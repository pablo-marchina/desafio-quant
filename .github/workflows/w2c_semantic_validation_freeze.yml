name: W2C Semantic Validation Byte Freeze

on:
  push:
    branches: [main]
    paths:
      - 'registry/w2c_semantic_validation_protocol_v1_0.json'
      - 'scripts/w2c_semantic_validation_v1_0.py'
      - 'scripts/w2c_semantic_validation_synthetic.py'
      - 'registry/w2c_semantic_validation_freeze_manifest_v1_0.json'
      - 'scripts/w2c_semantic_validation_freeze_validate.py'
      - '.github/workflows/w2c_semantic_validation_freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact semantic freeze bytes
        run: python scripts/w2c_semantic_validation_freeze_validate.py
      - name: Re-run all synthetic attacks under frozen bytes
        run: python scripts/w2c_semantic_validation_synthetic.py
      - name: Assert synthetic firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('registry/w2c_semantic_validation_synthetic_summary.json'))
          assert x['status']=='PASS_28_OF_28'
          assert x['real_candidate_data_read'] is False
          assert x['performance_data_read'] is False
          PY
