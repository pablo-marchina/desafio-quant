name: W2C PIT v2.1 Population Structure Audit
on:
  push:
    paths:
      - 'scripts/w2c_pit_v2_1_population_structure_audit.py'
      - '.github/workflows/w2c_pit_v2_1_population_structure_audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit right-censoring and macro jurisdictions
        run: python scripts/w2c_pit_v2_1_population_structure_audit.py
      - name: Assert audit remains performance blind
        run: |
          python - <<'PY'
          import json
          z=json.load(open('registry/w2c_pit_v2_1_population_structure_audit.json'))
          assert z['performance_blind'] is True and z['science_reopened'] is False and z['total']==260
          print('PASS structure audit')
          PY
