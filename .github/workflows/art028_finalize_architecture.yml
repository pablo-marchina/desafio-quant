name: ART-028 Finalize Architecture

on:
  push:
    paths:
      - 'scripts/art028_finalize_architecture.py'
      - 'registry/art028_summary.json'
      - 'registry/art028_feature_coverage.csv'
      - 'registry/art028_feature_correlations.csv'
      - 'registry/art028_era_stability.csv'
      - 'registry/art028_feature_distribution.csv'
      - '.github/workflows/art028_finalize_architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Finalize post-materialization architecture
        run: python scripts/art028_finalize_architecture.py
      - name: Validate freeze
        run: |
          python - <<'PY'
          import csv,json
          s=json.load(open('registry/art028_summary.json',encoding='utf-8'))
          a=s['post_materialization_architecture']
          assert s['decision']=='PASS_ART028_MOVEMENT_DATA_FEASIBILITY_AND_POST_MATERIALIZATION_ARCHITECTURE'
          assert a['outcomes_consulted'] is False
          assert len(a['primary_m_move_features'])==6
          assert a['art029_nonlinear_challenger_preference']=='matrix_profile_discord_6h'
          assert 'cusum_score_6h' in a['post_materialization_no_go']
          assert 'post_jump_half_life_hours' in a['post_materialization_no_go']
          rows=list(csv.DictReader(open('registry/art028_art029_handoff.csv',encoding='utf-8')))
          assert len(rows)==18
          PY
      - name: Commit freeze outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/art028_art029_handoff.csv registry/art028_summary.json docs/24_art028_movement_data_feasibility.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'art028: freeze post-materialization H2 architecture'
          git push
