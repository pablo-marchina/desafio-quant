name: W2C PIT v2 Byte Freeze
on:
  push:
    paths:
      - 'registry/w2c_pit_v2_freeze_manifest.json'
      - 'scripts/w2c_pit_v2_freeze_validate.py'
      - '.github/workflows/w2c_pit_v2_freeze.yml'
  workflow_dispatch:
jobs:
  freeze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate PIT-v2 byte freeze and rerun all no-network synthetics
        run: python scripts/w2c_pit_v2_freeze_validate.py
      - name: Validate frozen submission bundle and repository hygiene
        run: python scripts/repository_hygiene_validate.py
      - name: Assert network collection remains unauthorized
        run: |
          python - <<'PY'
          import json
          m=json.load(open('registry/w2c_pit_v2_freeze_manifest.json'))
          assert m['network_collection_authorized'] is False
          assert m['f1_f9_execution_authorized'] is False
          assert m['ias_execution_authorized'] is False
          assert m['w3_execution_authorized'] is False
          print('PASS: freeze only; real collection remains blocked')
          PY
