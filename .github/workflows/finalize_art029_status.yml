name: Finalize ART-029 Status

on:
  push:
    paths:
      - 'scripts/finalize_art029_status.py'
      - 'registry/art029_freeze_manifest.json'
      - '.github/workflows/finalize_art029_status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update STATUS
        run: python scripts/finalize_art029_status.py
      - name: Validate status transition
        run: |
          python - <<'PY'
          s=open('STATUS.yaml',encoding='utf-8').read()
          assert 'current_phase: ART030_EXP07I_H2_EXECUTION' in s
          assert 'status: PASS_ART029_PROTOCOL_FROZEN_BEFORE_OUTCOMES' in s
          assert 'outcomes_opening_authorized_for_art030: true' in s
          assert 'ART029_EXP07I_PROTOCOL_NOT_FROZEN' not in s
          assert 'ART030_EXP07I_H2_NOT_EXECUTED' in s
          PY
      - name: Commit STATUS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add STATUS.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'status: freeze ART-029 and authorize ART-030 outcomes'
          git push
