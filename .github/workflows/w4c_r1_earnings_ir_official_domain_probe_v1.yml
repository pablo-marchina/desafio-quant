name: W4-C R1 earnings IR official-domain capacity probe v1

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  W4C_R1_EARNINGS_IR_OFFICIAL_DOMAIN_EXECUTE: YES_FROZEN_OFFICIAL_DOMAIN_PROBE

jobs:
  execute-frozen-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate frozen executor and inputs without network
        run: python3 scripts/w4c_r1_earnings_ir_official_domain_discovery_executor_v1.py --validate-only

      - name: Execute frozen 40-event capacity probe
        run: python3 scripts/w4c_r1_earnings_ir_official_domain_discovery_executor_v1.py --execute

      - name: Commit probe outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            registry/w4c_r1_earnings_ir_official_domain_resolution_manifest_v1.csv.gz \
            registry/w4c_r1_earnings_ir_official_domain_navigation_manifest_v1.csv.gz \
            registry/w4c_r1_earnings_ir_official_domain_body_manifest_v1.csv.gz \
            registry/w4c_r1_earnings_ir_official_domain_capacity_summary_v1.json \
            registry/w4c_r1_earnings_ir_official_domain_execution_manifest_v1.json
          git commit -m 'registry: materialize W4-C R1 official-domain capacity probe'
          git push
