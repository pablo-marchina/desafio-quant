[project]
name = "nvidia-startup-ai-radar"
version = "0.1.0"
description = "Evidence-backed AI startup discovery and NVIDIA recommendation platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "langgraph>=0.2.0",
  "qdrant-client>=1.11.0",
  "httpx>=0.27.0",
  "trafilatura>=1.12.0",
  "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["web*", "tests*", "docs*", "scripts*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
