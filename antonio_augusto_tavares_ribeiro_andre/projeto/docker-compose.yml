services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tapi
      POSTGRES_PASSWORD: tapi
      POSTGRES_DB: tapi
    # Porta do HOST parametrizável (default 5432) — evita conflito com outro Postgres local.
    # Os containers entre si usam a porta INTERNA 5432; só o acesso do host muda (via .env).
    ports: ["${PG_HOST_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  redis:
    image: redis:7
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]

  # Langfuse v3 (tracing dos agentes, F0.8). Diferente do v2 single-container, o v3
  # se divide em web + worker e exige ClickHouse (eventos) + MinIO (blob S3). Casa com
  # o SDK langfuse 4.x (langfuse.langchain.CallbackHandler), compatível com langchain 1.x.
  langfuse-web:
    image: langfuse/langfuse:3
    depends_on:
      postgres: { condition: service_started }
      clickhouse: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["3001:3000"]
    environment: &langfuse-env
      # Segredos interpolados do .env (raiz) pelo Compose — nada sensível fica versionado aqui.
      DATABASE_URL: postgresql://tapi:tapi@postgres:5432/tapi
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3001
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379/0
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
      # Provisão headless no 1º boot (org/projeto/usuário/chaves) — dev local, sem clicar na UI.
      # As chaves de projeto são as mesmas que a app usa (LANGFUSE_PUBLIC_KEY/SECRET_KEY).
      LANGFUSE_INIT_ORG_ID: tapi-org
      LANGFUSE_INIT_PROJECT_ID: tapi
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: TAPI
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on:
      clickhouse: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_started }
    environment: *langfuse-env

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes: ["clickhousedata:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9090:9000", "9091:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    entrypoint: sh
    # Cria o bucket de eventos no boot e sobe o MinIO.
    command: -c 'mkdir -p /data/langfuse && minio server /data --console-address ":9001"'

  # API e worker compartilham a imagem Python (apps/Dockerfile); contexto = raiz do repo
  # (importam `packages.*`). O `environment` sobrepõe o `.env` (que aponta p/ localhost no
  # dev) com os hosts da rede do compose — é o que liga os serviços de fato (F0.2 DoD).
  api:
    build: &python-build
      context: .
      dockerfile: apps/Dockerfile
    env_file: .env
    environment: &service-hosts
      POSTGRES_URL: postgresql://tapi:tapi@postgres:5432/tapi
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_HOST: http://langfuse-web:3000
    depends_on: [postgres, qdrant, redis]
    ports: ["8080:8080"]

  worker:
    build: *python-build
    command: ["rq", "worker", "tapi", "--url", "redis://redis:6379/0"]
    env_file: .env
    environment: *service-hosts
    depends_on: [postgres, qdrant, redis]

  frontend:
    build:
      context: ./apps/frontend
      args:
        # A API e publicada na 8080 do host; o browser (no host) chama essa URL. NEXT_PUBLIC_*
        # e inlinado no build, por isso vai como build arg, nao env de runtime.
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on: [api]
    ports: ["3000:3000"]

  # NIM self-hosted na GPU local (F6). Requer NVIDIA Container Toolkit.
  # Triton + TensorRT-LLM (F6.8) NÃO estão neste compose base: o serving de
  # benchmark roda fora dele (notebook/ad-hoc na GPU), pois o compose base é o
  # ambiente de build (NIM hospedado). Ver docs/ARQUITETURA.md §5.19.
  nim:
    image: nvcr.io/nim/nvidia/llama-3.1-nemotron-nano-8b:latest
    profiles: ["gpu"]
    runtime: nvidia
    environment:
      NGC_API_KEY: ${NVIDIA_API_KEY}
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  pgdata:
  qdrantdata:
  clickhousedata:
  miniodata:
