# NeMo Guardrails (F4.5) — config do **output rail de evidência** do briefing TAPI.
#
# Roda no container Linux/GPU (dep `nemoguardrails`; adiada no Windows por puxar annoy/C++ — ver a
# memória dev-env do projeto). Carregada/validada por `packages/agents/guardrails.py::_nemo_guard`
# (`RailsConfig.from_path`). O **veredito** do rail é determinista: o custom action
# `check_recommendation_evidence` (actions.py) reusa a espinha `check_recommendations` — o invariante
# dos dois lados é regra dura, não juízo do LLM (anti-alucinação). O NeMo só **orquestra** o rail
# (e abriga rails futuros de diálogo/jailbreak/off-topic); nunca decide se há evidência.
#
# `models: []` — o rail de evidência não chama LLM (decisão por custom action determinista).
models: []

rails:
  output:
    flows:
      - check recommendation evidence
