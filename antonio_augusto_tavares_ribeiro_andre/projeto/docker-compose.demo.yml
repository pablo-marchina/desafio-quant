# Override da DEMO — aplica .env.demo POR CIMA do .env (so api/worker), sem alterar o .env padrao.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#   (ou, mais simples:  .\scripts\run.ps1 -Demo)
#
# O run padrao (docker compose up / .\scripts\run.ps1, sem -Demo) usa so o .env = config COMPLETA
# (caminho LLM cheio) — e o que voce cita na apresentacao de arquitetura. Aqui, a config reduzida
# a prova de rate limit do NIM: cache ON, so o extractor no LLM, render local, HITL ON.
#
# env_file como lista: o .env carrega a base e o .env.demo sobrepoe (ultimo vence).
services:
  api:
    env_file:
      - .env
      - .env.demo
  worker:
    env_file:
      - .env
      - .env.demo
