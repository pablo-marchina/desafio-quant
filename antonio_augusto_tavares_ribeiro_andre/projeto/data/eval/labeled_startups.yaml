    descricao: Chatbot de atendimento white-label montado sobre API de LLM.
    classificacao: AI-native
    region: wrapper
    aimi: { data_moat: 5, workflow_depth: 8, technical_optimization: 6, distribution_moat: 8 }
    rationale: IA é o produto, com algum encadeamento (P2 emergente), mas sem dado/serving próprios. Precisa de governança.
    expected_nvidia_techs:
    - tech: NeMo Guardrails
      prioridade: alta
    synthetic: true

  # ── alvo_graduacao ★ (AI-native · P1/P2 alto · P3 baixo): maior upside NVIDIA (F6.13) ──
