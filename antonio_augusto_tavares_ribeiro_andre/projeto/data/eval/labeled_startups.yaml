# Eval set rotulado inicial (F1.12) — ground-truth de classificação + AIMI esperado.
#
# IMPORTANTE: estas 24 entradas são FIXTURES-SEMENTE sintéticas (`synthetic: true`),
# ancoradas na definição de pilares/escala de `docs/ARQUITETURA.md §3.6` (F0.11) e no plano
# `classe × AIMI` (ARQUITETURA §3.6). NÃO são empresas reais — servem para
# (a) destravar F6.4 (correlação do índice) e F7.1/F7.2 (métricas) desde já, e (b) cobrir
# todas as regiões do "Mapa de decisão". Entradas REAIS (synthetic: false) devem trazer
# `evidence_urls` rastreáveis e são adicionadas por revisão humana (F1.14 + F7.1). Ver README.
#
# Pilares (0–25): data_moat (P1) · workflow_depth (P2) · technical_optimization (P3) ·
# distribution_moat (P4). Faixas: 0–6 ausente · 7–12 emergente · 13–18 estabelecido · 19–25 forte.
entries:
  # ── fora_escopo (non-AI): sem IA material no produto → briefing fora_de_escopo (F2.13) ──
  - id: eval-noai-01
    nome: Condomínio Fácil
    setor: PropTech / gestão
    descricao: SaaS de gestão de condomínios (boletos, assembleias, reservas). CRUD, sem IA.
    classificacao: non-AI
    region: fora_escopo
    aimi: { data_moat: 4, workflow_depth: 3, technical_optimization: 1, distribution_moat: 9 }
    rationale: Produto operacional sem IA; P3 zero, P2 baixo; alguma distribuição (P4) por base de síndicos.
    synthetic: true
  - id: eval-noai-02
    nome: Feira Local
    setor: Marketplace
    descricao: Marketplace conectando produtores rurais a consumidores; logística e pagamento simples.
    classificacao: non-AI
    region: fora_escopo
    aimi: { data_moat: 5, workflow_depth: 2, technical_optimization: 0, distribution_moat: 8 }
    rationale: Marketplace tradicional; nenhum sinal de IA. Dados de transação não realimentam modelo.
    synthetic: true
  - id: eval-noai-03
    nome: ObraCerta
    setor: ConstruTech
    descricao: ERP para pequenas construtoras — orçamento, cronograma e medição de obra.
    classificacao: non-AI
    region: fora_escopo
    aimi: { data_moat: 3, workflow_depth: 4, technical_optimization: 2, distribution_moat: 7 }
    rationale: Software de gestão sem IA; automação é regra de negócio, não modelo.
    synthetic: true
  - id: eval-noai-04
    nome: PetClub
    setor: E-commerce
    descricao: Clube de assinatura de produtos pet com recorrência e curadoria manual.
    classificacao: non-AI
    region: fora_escopo
    aimi: { data_moat: 6, workflow_depth: 2, technical_optimization: 1, distribution_moat: 10 }
    rationale: E-commerce de assinatura; curadoria humana, sem IA. P4 razoável pela base recorrente.
    synthetic: true

  # ── periferico (AI-enabled): IA é feature sobre produto não-IA → baixa prioridade ──
  # REGRA DE NeMo Guardrails (periferico + wrapper, F7.7): recebe quem tem SUPERFÍCIE GENERATIVA/
  # CONVERSACIONAL ao usuário (copiloto/chat/gerador de texto = risco de comportamento a governar);
  # features DISCRIMINATIVAS (triagem/classificação, recomendação, predição de no-show) NÃO recebem —
  # não geram texto livre. Por isso enabled-03 (copiloto fiscal) e enabled-05 (gerador de plano de aula)
  # recebem, mas enabled-01/02/04 (triagem/recomendação/previsor) = []. Em wrapper, o gate de prioridade
  # ainda manda: wrapper FRÁGIL (P1 E P2 ≤ 6) recebe só setor → wrapper-01/02/03 = []; wrapper-04 (chat,
  # P2=8 não-frágil) recebe Guardrails. Prioridade da tech única = ALTA (é a alavanca daquela empresa).
  - id: eval-enabled-01
    nome: GestRH
    setor: HRTech
    descricao: ATS/SaaS de RH consolidado que adicionou triagem de currículo via LLM de API.
    classificacao: AI-enabled
    region: periferico
    aimi: { data_moat: 7, workflow_depth: 6, technical_optimization: 5, distribution_moat: 16 }
    rationale: Núcleo é ATS tradicional; IA é feature de triagem sobre API. P4 forte (base instalada), P2 raso.
    expected_nvidia_techs: []
    synthetic: true
  - id: eval-enabled-02
    nome: LojaPro
    setor: Retail / e-commerce
    descricao: Plataforma de e-commerce com recomendação de produto via API de terceiros.
    classificacao: AI-enabled
    region: periferico
    aimi: { data_moat: 8, workflow_depth: 5, technical_optimization: 4, distribution_moat: 15 }
    rationale: Recomendação é acessório sobre e-commerce; IA não entrega o resultado central.
    expected_nvidia_techs: []
    synthetic: true
  - id: eval-enabled-03
    nome: ContaZen
    setor: FinTech / contabilidade
    descricao: Software de contabilidade com copiloto de dúvidas fiscais (chat sobre LLM).
    classificacao: AI-enabled
    region: periferico
    aimi: { data_moat: 6, workflow_depth: 7, technical_optimization: 4, distribution_moat: 13 }
    rationale: Produto contábil com copiloto periférico; precisa de controle de comportamento no chat.
    expected_nvidia_techs:
    - tech: NeMo Guardrails
      prioridade: alta
    synthetic: true
  - id: eval-enabled-04
    nome: AgendaJá
    setor: HealthTech / agendamento
    descricao: SaaS de agendamento para clínicas com previsor simples de no-show.
    classificacao: AI-enabled
    region: periferico
    aimi: { data_moat: 7, workflow_depth: 5, technical_optimization: 5, distribution_moat: 12 }
    rationale: Agendamento é o core; ML de no-show é feature pontual. IA não é o núcleo.
    expected_nvidia_techs: []
    synthetic: true
  - id: eval-enabled-05
    nome: EduPlan
    setor: EdTech
    descricao: Plataforma de gestão escolar com gerador de planos de aula via LLM.
    classificacao: AI-enabled
    region: periferico
    aimi: { data_moat: 6, workflow_depth: 6, technical_optimization: 4, distribution_moat: 11 }
    rationale: Gestão escolar com gerador acessório; IA assistiva sobre produto não-IA.
    expected_nvidia_techs:
    - tech: NeMo Guardrails
      prioridade: alta
    synthetic: true

  # ── wrapper (AI-native + AIMI baixo): IA é o núcleo, mas frágil/substituível ──
  - id: eval-wrapper-01
    nome: CopyGênio
    setor: MarTech
    descricao: Gerador de copy de marketing 100% sobre API de LLM; IA é o produto.
    classificacao: AI-native
    region: wrapper
    aimi: { data_moat: 3, workflow_depth: 5, technical_optimization: 3, distribution_moat: 6 }
    rationale: AI-native (IA é o núcleo) mas wrapper — sem dado próprio (P1) e 100% API (P3). Potencial não comprovado.
    expected_nvidia_techs: []
    synthetic: true
  - id: eval-wrapper-02
    nome: JurAssist
    setor: LegalTech
    descricao: Assistente jurídico que responde dúvidas via prompt sobre LLM externo.
    classificacao: AI-native
    region: wrapper
    aimi: { data_moat: 4, workflow_depth: 6, technical_optimization: 4, distribution_moat: 7 }
    rationale: IA central, mas sem corpus jurídico proprietário nem serving próprio; risco de substituição pelos labs.
    expected_nvidia_techs: []
    synthetic: true
  - id: eval-wrapper-03
    nome: ResumeAI
    setor: Produtividade
    descricao: App que resume documentos PDF via API de LLM.
    classificacao: AI-native
    region: wrapper
    aimi: { data_moat: 2, workflow_depth: 4, technical_optimization: 3, distribution_moat: 5 }
    rationale: "Wrapper puro: uma caixa de texto na frente de uma API. AIMI baixo em todos os pilares."
