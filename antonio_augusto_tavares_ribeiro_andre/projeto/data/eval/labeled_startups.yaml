    region: alvo_graduacao
    aimi: { data_moat: 20, workflow_depth: 17, technical_optimization: 6, distribution_moat: 12 }
    rationale: P1 forte (dataset clínico próprio) e P2 alto (fluxo integrado), mas P3 baixo (API crua) — alvo clássico de graduação.
    expected_nvidia_techs:
    - tech: NVIDIA NIM
      prioridade: alta
    - tech: TensorRT-LLM
      prioridade: alta
    - tech: Triton
      prioridade: media
    - tech: RAPIDS
      prioridade: baixa
    synthetic: true
