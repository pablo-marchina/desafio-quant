# Candidatas reais para o cohort builder (F1.14 → F7.1).
#
# POR QUE ESTE ARQUIVO: a descoberta por crawl (Scrapy, F1.6) das seeds `allow` rende **0
# páginas ao vivo** — robots.txt restritivo, portfólios JS-pesados (NVIDIA Inception) e bloqueio
# de bot. A coleta **por empresa** do pipeline (Tavily resolve o nome → Firecrawl raspa o site
# real, F1.1–F1.7) é muito mais robusta. Então a coorte real parte de uma lista CURADA de
# **empresas BR de IA reais e públicas**, e o pipeline faz o trabalho real por empresa.
#
# HONESTIDADE: o nome é a única parte curada (sourcing de analista). Cada empresa é **resolvida
# e VERIFICADA ao vivo** — domínio/nome que não rende perfil cai em `needs_review` e NÃO entra no
# eval (cohort.py). O rótulo (classe/AIMI) sai do próprio modelo → `label_source=model`, baseline
# circular, reportado à parte (ver `data/eval/README.md`). `query` é o termo de busca (Tavily/F1.1).
