# §9.1 — Diretórios / plataformas de dados de startups (BR + globais).
# Regra (F1.15): plataformas proprietárias têm ToS que costumam proibir scraping mesmo quando
# o robots.txt permite. Default = NÃO coletar direto; usar só via API/parceria (api_only) ou
# como pista de descoberta. A coleta de fato vem de fontes oficiais/notícias (allow).
sources:
  - id: distrito
    name: Distrito
    url: https://distrito.me
    type: directory
    country: BR
    policy: api_only
    robots: unknown
    tos_scraping: prohibited
    legal_basis: "Plataforma de dados proprietária — coletar só via API/parceria."
    notes: "Base rica de startups BR (inclui recortes de IA). Usar como descoberta, não scraping."

  - id: cubo-itau
    name: Cubo Itaú
    url: https://cubo.network
    type: directory
    country: BR
    policy: api_only
    robots: unknown
    tos_scraping: prohibited
    legal_basis: "Hub/comunidade com diretório próprio — sem permissão explícita de scraping."
    notes: "Listagem de startups associadas; bom para descoberta de nomes."

  - id: startse
    name: StartSe
    url: https://www.startse.com
    type: directory
    country: BR
    policy: deny
    robots: unknown
    tos_scraping: prohibited
    legal_basis: "Mídia + base proprietária; ToS restritivo."
    notes: "Conteúdo editorial pode ser citado como notícia (ver news.yaml), mas a base não."

  - id: open-startups
    name: 100 Open Startups
    url: https://www.openstartups.net
    type: directory
    country: BR
    policy: api_only
    robots: unknown
    tos_scraping: prohibited
    legal_basis: "Ranking proprietário; coletar só com permissão/API."
    notes: "Rankings (inclusive 'Open Corp') úteis como sinal de tração."

  - id: abstartups
    name: ABStartups
    url: https://abstartups.com.br
    type: directory
    country: BR
    policy: api_only
    robots: unknown
    tos_scraping: unknown
    legal_basis: "Associação setorial; verificar ToS antes de qualquer coleta."
    notes: "StartupBase é o diretório associado; tratar como descoberta."

  - id: sling-hub
    name: Sling Hub
    url: https://slinghub.com
    type: directory
    country: BR
    policy: api_only
    robots: unknown
    tos_scraping: prohibited
    legal_basis: "Base de dados de startups LatAm proprietária."
    notes: "Cobertura LatAm; uso via API/parceria."

  - id: crunchbase
    name: Crunchbase
    url: https://www.crunchbase.com
    type: directory
    country: GLOBAL
    policy: api_only
    robots: disallow
    tos_scraping: api_only
    legal_basis: "API oficial paga; scraping proibido por ToS."
    notes: "Funding/founders globais — só via API se houver plano."

  - id: tracxn
    name: Tracxn
    url: https://tracxn.com
    type: directory
    country: GLOBAL
    policy: api_only
    robots: disallow
    tos_scraping: api_only
    legal_basis: "Base proprietária; scraping proibido."
    notes: "Concorrente de mercado citado no brief (espaço em branco)."
