services:
  api:
    build: .
    container_name: nvidia_radar_api
    restart: unless-stopped
    depends_on:
      - qdrant
      - postgres
    environment:
      NVIDIA_RADAR_QDRANT_URL: http://qdrant:6333
      NVIDIA_RADAR_DATABASE_URL: postgresql://nvidia_radar:nvidia_radar@postgres:5432/nvidia_radar
      NVIDIA_RADAR_EMBEDDING_PROVIDER: sentence_transformers
      NVIDIA_RADAR_SENTENCE_TRANSFORMERS_MODEL: intfloat/multilingual-e5-small
      NVIDIA_RADAR_SENTENCE_TRANSFORMERS_LOCAL_FILES_ONLY: "false"
      NVIDIA_RADAR_VECTOR_SIZE: 384
      NVIDIA_RADAR_RERANKER_PROVIDER: hybrid
      NVIDIA_RADAR_STARTUP_SOURCE_PATH: data/startups_br.csv
    ports:
      - "8000:8000"
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nvidia_radar_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
  postgres:
    image: postgres:16
    container_name: nvidia_radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nvidia_radar
      POSTGRES_USER: nvidia_radar
      POSTGRES_PASSWORD: nvidia_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
