name: Scheduled Startup Scan

on:
  schedule:
    # 09:00 BRT (UTC-3) on Mondays and Thursdays.
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  scheduled-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      BRASIL_IO_API_TOKEN: ${{ secrets.BRASIL_IO_API_TOKEN }}
      SCHEDULED_SCAN_DISCOVERY_COMMAND: ${{ vars.SCHEDULED_SCAN_DISCOVERY_COMMAND || 'python -m scraper.rss_news.main' }}
      SCHEDULED_SCAN_SOURCE_TABLE: ${{ vars.SCHEDULED_SCAN_SOURCE_TABLE || 'startups_brazil' }}
      SCHEDULED_SCAN_SKIP_VALIDATION: ${{ vars.SCHEDULED_SCAN_SKIP_VALIDATION || 'false' }}
      RSS_NEWS_FEEDS: ${{ vars.RSS_NEWS_FEEDS || 'https://startups.com.br/feed/,https://braziljournal.com/feed/' }}
      RSS_NEWS_KEYWORDS: ${{ vars.RSS_NEWS_KEYWORDS || 'startup,startups,inteligencia artificial,ia,ai,machine learning,llm,fintech,healthtech,edtech,hrtech,deep tech,saas,aporte,rodada,venture capital' }}
      RSS_NEWS_LOOKBACK_DAYS: ${{ vars.RSS_NEWS_LOOKBACK_DAYS || '14' }}
      RSS_NEWS_MAX_ENTRIES_PER_FEED: ${{ vars.RSS_NEWS_MAX_ENTRIES_PER_FEED || '50' }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-20b:free' }}
      OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OPENROUTER_HTTP_REFERER: ${{ vars.OPENROUTER_HTTP_REFERER || 'https://startup-ai-radar.local' }}
      OPENROUTER_X_TITLE: ${{ vars.OPENROUTER_X_TITLE || 'Startup AI Radar' }}
      GROQ_CNPJ_MODEL: ${{ vars.GROQ_CNPJ_MODEL || 'llama-3.3-70b-versatile' }}
      ENRICHMENT_SUPABASE_TABLE: ${{ vars.ENRICHMENT_SUPABASE_TABLE || 'validated_startup_candidates' }}
      ENRICHMENT_RESULTS_TABLE: ${{ vars.ENRICHMENT_RESULTS_TABLE || 'startup_ai_radar_catalog' }}
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/scraping.txt
            requirements/embedding.txt
            requirements/api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/scraping.txt
          python -m pip install -r requirements/embedding.txt
          python -m pip install -r requirements/api.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run scheduled scan
        run: python scripts/run_scheduled_scan.py
