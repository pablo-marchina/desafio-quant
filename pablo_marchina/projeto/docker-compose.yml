name: nvidia-startup-ai-radar

x-backend-environment: &backend-environment
  APP_MODE: product
  API_AUTH_MODE: internal_proxy
  INTERNAL_PROXY_KEY: ${INTERNAL_PROXY_KEY:?Set INTERNAL_PROXY_KEY in .env}
  PRODUCT_DB_URL: postgresql+psycopg2://radar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/nvidia_radar
  LANGGRAPH_CHECKPOINTER: postgres
  LANGGRAPH_POSTGRES_URL: postgresql://radar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/nvidia_radar
  AGENT_ORCHESTRATION_ENABLED: "true"
  RAG_REQUIRED_FOR_PRODUCT: "true"
  RAG_VECTOR_BACKEND: qdrant
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-nvidia_corpus}
  QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
  QDRANT_MIN_POINTS: ${QDRANT_MIN_POINTS:-10}
  RERANKER_PROVIDER: triton
  TRITON_RERANKER_ENABLED: "true"
  TRITON_RERANKER_REQUIRED: "true"
  TRITON_RERANKER_URL: http://triton-reranker:8000/v2/models/cross_encoder/infer
  TRITON_RERANKER_HEALTH_URL: http://triton-reranker:8000/v2/models/cross_encoder/ready
  PRODUCT_DATA_DIR: /app/data/product
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

x-backend-service: &backend-service
  image: academy-nvidia-backend:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    <<: *backend-environment
  networks:
    - startup-radar-net

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: nvidia_radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d nvidia_radar"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - startup-radar-net

  qdrant:
    image: qdrant/qdrant:v1.18.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - startup-radar-net

  triton-reranker:
    image: academy-nvidia-triton-reranker:local
    build:
      context: .
      dockerfile: docker/triton/Dockerfile
    restart: unless-stopped
    environment:
      CE_MODEL_NAME: cross-encoder/ms-marco-MiniLM-L-6-v2
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v2/models/cross_encoder/ready || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 90s
    networks:
      - startup-radar-net

  init-volumes:
    <<: *backend-service
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/data/product /opt/model-cache && chown -R 65534:65534 /app/data/product /opt/model-cache"]
    volumes:
      - product_data:/app/data/product
      - model_cache:/opt/model-cache

  migrate:
    <<: *backend-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully
    volumes:
      - product_data:/app/data/product
      - model_cache:/opt/model-cache

  rag-bootstrap:
    <<: *backend-service
    command: ["python", "scripts/bootstrap_nvidia_corpus.py"]
    depends_on:
      qdrant:
        condition: service_started
      init-volumes:
        condition: service_completed_successfully
    volumes:
      - product_data:/app/data/product
      - model_cache:/opt/model-cache

  api:
    <<: *backend-service
    restart: unless-stopped
    command: ["sh", "-c", "python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-2}"]
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-bootstrap:
        condition: service_completed_successfully
      triton-reranker:
        condition: service_healthy
    volumes:
      - product_data:/app/data/product
      - model_cache:/opt/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  workflow-worker:
    <<: *backend-service
    restart: unless-stopped
    command: ["python", "-m", "src.orchestration.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-bootstrap:
        condition: service_completed_successfully
      triton-reranker:
        condition: service_healthy
    volumes:
      - product_data:/app/data/product
      - model_cache:/opt/model-cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib; raise SystemExit(0 if b'src.orchestration.worker' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: academy-nvidia-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      INTERNAL_PROXY_KEY: ${INTERNAL_PROXY_KEY:?Set INTERNAL_PROXY_KEY in .env}
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - startup-radar-net

volumes:
  postgres_data:
  qdrant_data:
  product_data:
  model_cache:

networks:
  startup-radar-net:
    driver: bridge
